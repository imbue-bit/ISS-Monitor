<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ISS Monitor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        h1 { margin: 0; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; border-left: 3px solid #00aaff; padding-left: 10px;}
        .data-row { font-size: 12px; margin-top: 4px; font-family: 'Courier New', monospace; color: #ccc; }
        .val { color: #fff; font-weight: bold; }
        
        .iss-label {
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border: 1px solid rgba(0, 255, 204, 0.5);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-family: monospace; letter-spacing: 2px;
            text-align: center;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

<div id="loading">
</div>

<div id="hud">
    <h1>ISS Monitor</h1>
    <div class="data-row">LAT: <span class="val" id="lat">--</span> LON: <span class="val" id="lon">--</span></div>
    <div class="data-row">CAM: <span class="val">ISS</span></div>
</div>

<script type="x-shader/x-vertex" id="vertexShader">
    varying vec3 vNormal;
    varying vec3 vPositionNormal;
    void main() {
        vNormal = normalize(normalMatrix * normal);
        vPositionNormal = normalize((modelViewMatrix * vec4(position, 1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
</script>
<script type="x-shader/x-fragment" id="fragmentShader">
    varying vec3 vNormal;
    varying vec3 vPositionNormal;
    void main() {
        // 计算视线与法线的夹角，产生边缘发光
        float intensity = pow(0.65 - dot(vNormal, vPositionNormal), 4.0);
        // 模拟一下瑞利散射
        gl_FragColor = vec4(0.1, 0.5, 0.9, 1.0) * intensity * 1.5; 
    }
</script>

<script>
    let TLE = {
        line1: "1 25544U 98067A   23284.56592394  .00015423  00000-0  28296-3 0  9993",
        line2: "2 25544  51.6416 241.0439 0005423  60.8200 299.3894 15.49866668419283"
    };

    const R_EARTH = 10;
    const R_CLOUDS = 10.15; // 云层半径
    const R_ATMOS = 11.5; // 大气半径
    
    let scene, camera, renderer, labelRenderer, composer;
    let earth, clouds, atmosphere, sunMesh;
    let issSprite, issLabel, issOrbitLine;
    let satrec;
    let sunLight;

    const loader = new THREE.TextureLoader();

    async function fetchRealTimeTLE() {
        const targetUrl = 'https://www.heavens-above.com/orbit.aspx?satid=25544';
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        try {
            const response = await fetch(proxyUrl);
            const data = await response.json();
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, "text/html");
            const l1 = doc.getElementById("ctl00_cph1_lblLine1").innerText.trim();
            const l2 = doc.getElementById("ctl00_cph1_lblLine2").innerText.trim();
            if(l1 && l2) { TLE.line1 = l1; TLE.line2 = l2; }
            console.log("TLE Updated");
        } catch (e) { console.warn("Network error, using cached TLE"); }
        
        init();
    }

    function init() {
        document.getElementById('loading').style.display = 'none';

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(22, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50); 
        
        // 渲染器配置
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // 开启 ACES Filmic Tone Mapping
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        // 开启物理光照计算
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // CSS2D 标签渲染器
        labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        document.body.appendChild(labelRenderer.domElement);

        const renderScene = new THREE.RenderPass(scene, camera);
        
        // 参数：分辨率, 强度, 半径, 阈值
        // 强度 1.5 让受光面真的很亮，阈值 0.1 保证只有亮的地方发光
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.1);
        
        composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        createUniverse();
        createEarthSystem();
        createISS();
        createLighting();

        // 初始化卫星计算对象
        satrec = satellite.twoline2satrec(TLE.line1, TLE.line2);

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    function createUniverse() {
        // Skybox
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        // 翻转几何体，让贴图在内部可见
        geometry.scale(-1, 1, 1); 
        const material = new THREE.MeshBasicMaterial({
            map: loader.load('https://unpkg.com/three-globe/example/img/night-sky.png')
        });
        const starSphere = new THREE.Mesh(geometry, material);
        scene.add(starSphere);
    }

    function createEarthSystem() {
        const earthGroup = new THREE.Group();
        // 地轴23.5度
        earthGroup.rotation.z = 23.5 * Math.PI / 180; 
        scene.add(earthGroup);
        
        earth = earthGroup; 

        const earthGeo = new THREE.SphereGeometry(R_EARTH, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
            map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            bumpMap: loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
            bumpScale: 0.15, // 模拟山脉凹凸
            specularMap: loader.load('https://unpkg.com/three-globe/example/img/earth-water.png'),
            shininess: 15
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earthMesh);

        const cloudGeo = new THREE.SphereGeometry(R_CLOUDS, 64, 64);
        const cloudMat = new THREE.MeshLambertMaterial({
            map: loader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png'),
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        clouds = new THREE.Mesh(cloudGeo, cloudMat);
        earthGroup.add(clouds);

        const atmosGeo = new THREE.SphereGeometry(R_ATMOS, 64, 64);
        const atmosMat = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmosphere); // 大气层不随地球转，或者随地球位置动但自己不转
    }

    function createISS() {
        const map = new THREE.TextureLoader().load( 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Basic_red_dot.png/64px-Basic_red_dot.png' );
        const material = new THREE.SpriteMaterial( { map: map, color: 0x00ffcc } );
        issSprite = new THREE.Sprite( material );
        issSprite.scale.set(0.5, 0.5, 1);
        scene.add( issSprite );

        const div = document.createElement( 'div' );
        div.className = 'iss-label';
        div.textContent = 'ISS';
        issLabel = new THREE.CSS2DObject( div );
        issLabel.position.set( 0, 1, 0 );
        issSprite.add( issLabel );

        // 轨道线容器
        const lineGeo = new THREE.BufferGeometry();
        const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000, opacity: 0.3, transparent: true });
        issOrbitLine = new THREE.Line(lineGeo, lineMat);
        scene.add(issOrbitLine);
    }

    function createLighting() {
        sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(-80, 20, 50); // 形成漂亮的明暗交界线
        scene.add(sunLight);

        const sunGeo = new THREE.SphereGeometry(2, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.copy(sunLight.position);
        scene.add(sunMesh);

        const ambientLight = new THREE.AmbientLight(0x020202); 
        scene.add(ambientLight);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight); // 别忘了更新后期处理的大小
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    function getThreePosFromTLE(date) {
        const positionAndVelocity = satellite.propagate(satrec, date);
        const positionEci = positionAndVelocity.position;
        
        if (!positionEci) return null;

        const scale = R_EARTH / 6371;

        // ECI 里 X 指向春分点, Z 指向北极
        // Three.js 里 Y 向上, Z 向屏幕外
        // 这里 ECI X -> Three X, ECI Z -> Three Y, ECI Y -> Three -Z
        const x = positionEci.x * scale;
        const y = positionEci.z * scale; 
        const z = -positionEci.y * scale;

        return { vec3: new THREE.Vector3(x, y, z), eci: positionEci };
    }

    function updateOrbitPath(now) {
        const points = [];
        const segments = 100;
        const duration = 95;
        
        for (let i = 0; i <= segments; i++) {
            const t = new Date(now.getTime() + (i * duration * 60000 / segments));
            const posData = getThreePosFromTLE(t);
            if (posData) {
                points.push(posData.vec3);
            }
        }
        
        if (points.length > 0) {
            issOrbitLine.geometry.setFromPoints(points);
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        const now = new Date();
        
        const gmst = satellite.gstime(now);
        if(earth) {
            earth.rotation.y = gmst; 
        }

        if(clouds) {
            clouds.rotation.y = gmst * 1.0005; 
            clouds.rotation.z = 0.05;
        }

        if (satrec) {
            const posData = getThreePosFromTLE(now);
            
            if (posData) {
                issSprite.position.copy(posData.vec3);

                const positionGd = satellite.eciToGeodetic(posData.eci, gmst);
                const lon = satellite.degreesLong(positionGd.longitude).toFixed(4);
                const lat = satellite.degreesLat(positionGd.latitude).toFixed(4);
                
                document.getElementById('lat').innerText = lat + "°";
                document.getElementById('lon').innerText = lon + "°";

                updateOrbitPath(now);
            }
        }

        composer.render();
        labelRenderer.render(scene, camera);
    }

    fetchRealTimeTLE();

</script>
</body>
</html>
